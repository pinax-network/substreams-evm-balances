name: Release

# Two packages are released, each by its own tag (owner, 2026-10-13): a tag
# `evm-balances-native-v<version>` or `evm-balances-erc20-v<version>`, equal to
# the spkg name of native/balances or erc20/balances, builds that package on
# Linux, the canonical builder, and publishes a GitHub release with its spkg and
# the notes of .github/release-notes/<package>.md. A pull request that changes
# this workflow or the notes dry-runs both packages without releasing.
on:
  push:
    tags:
      - "evm-balances-native-v*"
      - "evm-balances-erc20-v*"
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/release-notes/**

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # As in ci.yml: the CLI behind the recorded module hashes.
  SUBSTREAMS_VERSION: v1.22.0
  SUBSTREAMS_SHA256: 6eef6182d8d9e3c0147a3d03f38fc2b9c0f96900d040132294a0b540e691ae67

jobs:
  select:
    name: Select the package
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.select.outputs.packages }}
    steps:
      - id: select
        run: |
          case "$GITHUB_REF_TYPE:$GITHUB_REF_NAME" in
            tag:evm-balances-native-v*) echo 'packages=["native"]' >> "$GITHUB_OUTPUT" ;;
            tag:evm-balances-erc20-v*) echo 'packages=["erc20"]' >> "$GITHUB_OUTPUT" ;;
            tag:*) echo "::error::$GITHUB_REF_NAME names no package"; exit 1 ;;
            *) echo 'packages=["native", "erc20"]' >> "$GITHUB_OUTPUT" ;;
          esac

  release:
    name: Release evm-balances-${{ matrix.package }}
    needs: select
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.select.outputs.packages) }}
    env:
      DIR: ${{ matrix.package }}/balances
      NOTES: .github/release-notes/${{ matrix.package }}.md
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Package and tag
        run: |
          name=$(awk '$1 == "name:" {print $2; exit}' "$DIR/substreams.yaml")
          version=$(awk '$1 == "version:" {print $2; exit}' "$DIR/substreams.yaml")
          package=${name//_/-}
          tag="$package-$version"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but $DIR/substreams.yaml is $package $version: tag $tag"
            exit 1
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "PACKAGE=$package" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "SPKG=$tag.spkg" >> "$GITHUB_ENV"
      # The sink the package supports, from its Makefile (#120).
      - name: Supported sink
        run: |
          sink=$(awk '$1 == "SINK_VERSION" {print $3}' "$DIR/Makefile")
          commit=$(awk '$1 == "SINK_COMMIT" {print $3}' "$DIR/Makefile")
          test -n "$sink" && test -n "$commit"
          echo "SINK=$sink" >> "$GITHUB_ENV"
          echo "SINK_COMMIT=$commit" >> "$GITHUB_ENV"
      - name: Rust toolchain
        run: |
          rustup toolchain install
          rustc -vV
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: substreams CLI
        run: |
          curl -fsSL -o "$RUNNER_TEMP/substreams.tar.gz" \
            "https://github.com/streamingfast/substreams/releases/download/$SUBSTREAMS_VERSION/substreams_linux_x86_64.tar.gz"
          echo "$SUBSTREAMS_SHA256  $RUNNER_TEMP/substreams.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/substreams.tar.gz" -C "$RUNNER_TEMP" substreams
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Build and pack
        run: |
          make -C "$DIR" build schema
          mkdir dist
          substreams pack "$DIR/substreams.yaml" -o "dist/{spkgDefaultName}"
          test -f "dist/$SPKG"
      - name: Registry verify
        run: |
          substreams registry verify "dist/$SPKG" | tee "$RUNNER_TEMP/verify.txt"
          if grep -q "warning" "$RUNNER_TEMP/verify.txt"; then echo "::error::registry verify reported warnings for $SPKG"; exit 1; fi
      # The spkg must carry the module hashes of the committed spkg, which CI's
      # Package hashes job already checks against the source, and embed the
      # schema of make schema.
      - name: Matches the committed spkg
        run: |
          hashes() { substreams info "$1" | awk '/^Name:/ {n = $2} /^Hash:/ {print n, $2}'; }
          diff <(hashes "dist/$SPKG") <(hashes "spkg/$SPKG")
          schema=$(mktemp -d)
          substreams info "dist/$SPKG" --output-sinkconfig-files-path "$schema" > /dev/null
          cmp "$DIR/clickhouse/schema.sql" "$schema/schema"
      # The run's record of what it built; the release carries no hash file.
      - name: Summary
        run: |
          wasm=$(awk '$1 == "file:" {print $2; exit}' "$DIR/substreams.yaml")
          {
            echo "### $TAG ($GITHUB_SHA, $(rustc -V), substreams $SUBSTREAMS_VERSION)"
            echo
            echo '| Module | Hash |'
            echo '| --- | --- |'
            substreams info "dist/$SPKG" | awk '/^Name:/ {n = $2} /^Hash:/ {print "| " n " | `" $2 "` |"}'
            echo
            echo "WASM \`$(basename "$wasm")\`: \`$(sha256sum "$DIR/$wasm" | cut -d' ' -f1)\`"
            echo
            echo "\`$DIR/clickhouse/schema.sql\`: \`$(sha256sum "$DIR/clickhouse/schema.sql" | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Notes
        run: |
          REPO=$GITHUB_REPOSITORY envsubst '${REPO} ${TAG} ${PACKAGE} ${VERSION} ${SPKG} ${SINK} ${SINK_COMMIT}' < "$NOTES" > "$RUNNER_TEMP/notes.md"
          if grep -n '\${' "$RUNNER_TEMP/notes.md"; then echo "::error::unrendered placeholder in the release notes"; exit 1; fi
          cat "$RUNNER_TEMP/notes.md"
      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          gh release create "$TAG" "$SPKG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
