name: Release

# Only evm-balances is released (owner, 2026-10-13). A tag `v<version>`,
# equal to evm-balances/substreams.yaml's version, builds it on Linux, the
# canonical builder, packs it with the two packages it imports, and publishes
# a GitHub release with the three spkgs and the notes of
# .github/release-notes.md. A pull request that changes this workflow or the
# notes dry-runs it without releasing.
on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/release-notes.md

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # As in ci.yml: the CLI behind the recorded module hashes.
  SUBSTREAMS_VERSION: v1.22.0
  SUBSTREAMS_SHA256: 6eef6182d8d9e3c0147a3d03f38fc2b9c0f96900d040132294a0b540e691ae67

jobs:
  release:
    name: Release evm-balances
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Package and tag
        run: |
          spkg() {
            name=$(awk '$1 == "name:" {print $2; exit}' "$1/substreams.yaml")
            version=$(awk '$1 == "version:" {print $2; exit}' "$1/substreams.yaml")
            echo "${name//_/-}-$version"
          }
          packed=$(spkg evm-balances)
          version=${packed#evm-balances-}
          tag="$version"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but evm-balances/substreams.yaml is $version: tag $tag"
            exit 1
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "SPKG=$packed.spkg" >> "$GITHUB_ENV"
          echo "NATIVE_SPKG=$(spkg native/balances).spkg" >> "$GITHUB_ENV"
          echo "ERC20_SPKG=$(spkg erc20/balances).spkg" >> "$GITHUB_ENV"
      # The sink that evm-balances supports, from its Makefile (#120).
      - name: Supported sink
        run: |
          sink=$(awk '$1 == "SINK_VERSION" {print $3}' evm-balances/Makefile)
          commit=$(awk '$1 == "SINK_COMMIT" {print $3}' evm-balances/Makefile)
          test -n "$sink" && test -n "$commit"
          echo "SINK=$sink" >> "$GITHUB_ENV"
          echo "SINK_COMMIT=$commit" >> "$GITHUB_ENV"
      - name: Rust toolchain
        run: |
          rustup toolchain install
          rustc -vV
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: substreams CLI
        run: |
          curl -fsSL -o "$RUNNER_TEMP/substreams.tar.gz" \
            "https://github.com/streamingfast/substreams/releases/download/$SUBSTREAMS_VERSION/substreams_linux_x86_64.tar.gz"
          echo "$SUBSTREAMS_SHA256  $RUNNER_TEMP/substreams.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/substreams.tar.gz" -C "$RUNNER_TEMP" substreams
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # make -C evm-balances build builds the imported packages one at a time,
      # so their WASM equals their standalone builds'.
      - name: Build and pack
        run: |
          make -C evm-balances build schema
          mkdir dist
          for p in evm-balances native/balances erc20/balances; do substreams pack "$p/substreams.yaml" -o "dist/{spkgDefaultName}"; done
          for s in "$SPKG" "$NATIVE_SPKG" "$ERC20_SPKG"; do test -f "dist/$s"; done
      - name: Registry verify
        run: |
          for s in "$SPKG" "$NATIVE_SPKG" "$ERC20_SPKG"; do
            substreams registry verify "dist/$s" | tee "$RUNNER_TEMP/verify.txt"
            if grep -q "warning" "$RUNNER_TEMP/verify.txt"; then echo "::error::registry verify reported warnings for $s"; exit 1; fi
          done
      # Each spkg must carry the module hashes of its committed spkg, which
      # CI's Package hashes job already checks against the source, and each
      # map package those of the same map inside evm-balances. The embedded
      # schema must equal make schema's.
      - name: Matches the committed spkgs
        run: |
          hashes() { substreams info "$1" | awk '/^Name:/ {n = $2} /^Hash:/ {print n, $2}'; }
          for s in "$SPKG" "$NATIVE_SPKG" "$ERC20_SPKG"; do diff <(hashes "dist/$s") <(hashes "spkg/$s"); done
          diff <(hashes "dist/$NATIVE_SPKG" | sed 's/^/native_balances:/') <(hashes "dist/$SPKG" | grep '^native_balances:')
          diff <(hashes "dist/$ERC20_SPKG" | sed 's/^/erc20_balances:/') <(hashes "dist/$SPKG" | grep '^erc20_balances:')
          schema=$(mktemp -d)
          substreams info "dist/$SPKG" --output-sinkconfig-files-path "$schema" > /dev/null
          cmp evm-balances/clickhouse/schema.sql "$schema/schema"
      # The run's record of what it built; the release carries no hash file.
      - name: Summary
        run: |
          {
            echo "### $TAG ($GITHUB_SHA, $(rustc -V), substreams $SUBSTREAMS_VERSION)"
            echo
            echo '| Package | Module | Hash |'
            echo '| --- | --- | --- |'
            for s in "$SPKG" "$NATIVE_SPKG" "$ERC20_SPKG"; do
              substreams info "dist/$s" | awk -v s="$s" '/^Name:/ {n = $2} /^Hash:/ {print "| " s " | " n " | `" $2 "` |"}'
            done
            echo
            echo '| WASM | sha256 |'
            echo '| --- | --- |'
            (cd target/wasm32-unknown-unknown/release && sha256sum native_balances.wasm erc20_balances.wasm evm_balances.wasm) | awk '{print "| " $2 " | `" $1 "` |"}'
            echo
            echo "\`evm-balances/clickhouse/schema.sql\`: \`$(sha256sum evm-balances/clickhouse/schema.sql | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Notes
        run: |
          REPO=$GITHUB_REPOSITORY envsubst '${REPO} ${TAG} ${VERSION} ${SPKG} ${NATIVE_SPKG} ${ERC20_SPKG} ${SINK} ${SINK_COMMIT}' < .github/release-notes.md > "$RUNNER_TEMP/notes.md"
          if grep -n '\${' "$RUNNER_TEMP/notes.md"; then echo "::error::unrendered placeholder in the release notes"; exit 1; fi
          cat "$RUNNER_TEMP/notes.md"
      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          gh release create "$TAG" "$SPKG" "$NATIVE_SPKG" "$ERC20_SPKG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
