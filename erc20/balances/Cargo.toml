[package]
name = "erc20-balances"
description = "Experimental RPC-free ERC-20 balances inferred from Extended block storage, with a db_out for the substreams-evm ClickHouse tables"
edition = { workspace = true }
version = "0.7.0"
license = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
substreams = { workspace = true }
substreams-ethereum = { workspace = true }
proto = { path = "../../proto", default-features = false }
hex = "0.4"
tiny-keccak = { version = "2.0", features = ["keccak"] }
# 5.0.0 (buffa, substreams 0.8.0). Upstream substreams-evm uses 3.0.0; the rows
# are the same, and each Field now also carries update_op = SET (README).
substreams-database-change = "=5.0.0"

[dev-dependencies]
buffa = { workspace = true }
buffa-types = { workspace = true }
serde_json = "1"
sha2 = "0.11"
